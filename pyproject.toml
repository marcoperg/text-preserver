[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-preserver"
version = "0.1.0.dev0"
description = "Preserve vulnerable digital text collections and their context"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "text-preserver contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Archiving",
]
dependencies = []

[project.scripts]
text-preserver = "text_preserver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/text-preserver/collections/etcsl" = [
  "collections/etcsl/README.md",
  "collections/etcsl/collection.toml",
  "collections/etcsl/inventory.py",
]
"share/text-preserver/collections/etcsl/fixtures" = [
  "collections/etcsl/fixtures/catalogue.html",
  "collections/etcsl/fixtures/expected-ids.txt",
]
"share/text-preserver/collections/etcsl/seeds" = [
  "collections/etcsl/seeds/repository.txt",
  "collections/etcsl/seeds/web.txt",
]
"share/text-preserver/collections/etcsl/rules" = [
  "collections/etcsl/rules/preservation.pl",
]
"share/text-preserver/collections/gretil" = [
  "collections/gretil/README.md",
  "collections/gretil/collection.toml",
  "collections/gretil/inventory.py",
]
"share/text-preserver/collections/gretil/fixtures" = [
  "collections/gretil/fixtures/catalogue.html",
  "collections/gretil/fixtures/reviewed-tei-ids.txt",
  "collections/gretil/fixtures/sample-expected-ids.txt",
]
"share/text-preserver/collections/gretil/seeds" = [
  "collections/gretil/seeds/bulk-packages.txt",
  "collections/gretil/seeds/current-register.txt",
  "collections/gretil/seeds/dictionaries.txt",
  "collections/gretil/seeds/frozen-register.txt",
]
"share/text-preserver/collections/sacred-texts" = [
  "collections/sacred-texts/README.md",
  "collections/sacred-texts/collection.toml",
  "collections/sacred-texts/inventory.py",
]
"share/text-preserver/collections/sacred-texts/seeds" = [
  "collections/sacred-texts/seeds/internet-archive-2021.txt",
  "collections/sacred-texts/seeds/wayback-download-recovery.txt",
]
