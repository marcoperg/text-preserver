[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-preserver"
version = "0.1.0.dev0"
description = "Preserve vulnerable digital text collections and their context"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "text-preserver contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Archiving",
]
dependencies = []

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
]
dev = [
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
text-preserver = "text_preserver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"text_preserver.builtin_recipes" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = [
  "__pycache__/*",
  "*/__pycache__/*",
  "*/*/__pycache__/*",
  "**/__pycache__/*",
  "*.pyc",
  "*/*.pyc",
  "*/*/*.pyc",
  "**/*.pyc",
  "**/*.pyo",
  "**/.DS_Store",
]

[tool.setuptools.data-files]
"share/text-preserver/schemas" = [
  "schemas/capture-manifest.schema.json",
  "schemas/collection-recipe.schema.json",
  "schemas/config.schema.json",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
exclude = "^src/text_preserver/builtin_recipes/"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
