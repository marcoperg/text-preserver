recipe_api = 1

[collection]
id = "etcsl"
title = "Electronic Text Corpus of Sumerian Literature"
homepage = "https://etcsl.orinst.ox.ac.uk/"
description = "Sumerian literary compositions with transliterations, English translations, bibliography, and XML source data."
risk_note = "Project funding ended in 2006; the historical interface depends on aging CGI and server infrastructure."
rights_note = "Public access does not imply permission to redistribute captures; preserve the site's notices and repository metadata."
tags = ["sumerian", "literature", "philology", "digital-humanities"]
enabled = true

[collection.capture]
wait = 2.0
random_wait = true
timeout = 30
tries = 2
quota = "250M"
limit_rate = "250K"

[collection.analysis]
inventory_adapter = "inventory.py"
reader_adapter = "reader.py"
ciao_rules = "rules/preservation.pl"
reader_source = "ota-dataset"
expected_work_count = 394
required_representation_kinds = ["transliteration"]

[[collection.sources]]
id = "ota-record"
kind = "web"
title = "Oxford Text Archive repository record"
description = "Institutional metadata and preservation context for OTA deposit 2518."
required = true
seeds = [
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/handle/20.500.12024/2518",
]
allowed_hosts = ["ota.bodleian.ox.ac.uk"]

[collection.sources.capture]
recursive = false
page_requisites = false
convert_links = false
adjust_extension = false
quota = "10M"

[[collection.sources]]
id = "ota-dataset"
kind = "http-file"
title = "Complete ETCSL Oxford Text Archive deposit"
description = "The eleven files advertised for OTA deposit 2518, including the XML corpus, catalogue, documentation, metadata, and support declarations."
required = true
seeds = [
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/contents.txt?sequence=3&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/corphdr.xml?sequence=4&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/etcsl-extensions.dtd?sequence=5&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/etcsl-extensions.ent?sequence=6&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/etcslfullcat.html?sequence=7&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/etcslmanual.html?sequence=8&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/etcsl-sux.ent?sequence=9&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/etcsl.xml?sequence=10&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/etcsl.zip?sequence=11&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/header2518.xml?sequence=12&isAllowed=y",
  "https://ota.bodleian.ox.ac.uk/repository/xmlui/bitstream/handle/20.500.12024/2518/readme.txt?sequence=13&isAllowed=y",
]
allowed_hosts = ["ota.bodleian.ox.ac.uk"]

[collection.sources.capture]
recursive = false
page_requisites = false
convert_links = false
adjust_extension = false
content_disposition = true
quota = "10M"
